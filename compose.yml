# Local demo of the web app. There is no backend at runtime: the image bakes in the
# JSON export under frontend/src/data/pulse, regenerated with `make pulse-web`.
#   docker compose up --build
#   open http://localhost:3000/company/COMP_0001
services:
  web:
    build:
      context: ./frontend
    image: hackspain-web:latest
    container_name: hackspain-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    # Nexo reads AI_GATEWAY_API_KEY from frontend/.env; without it the assistant runs its demo.
    env_file:
      - path: ./frontend/.env
        required: false
