[project]
name = "ml-service"
version = "0.1.0"
description = "HackSpain 2026 · Embat PULSE: cleaning, score, forecast, signals and advisor as a command-line pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
pulse = "ml_service.pulse.run.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_service"]

[tool.basedpyright]
exclude = [
    "tests",
    "**/__pycache__"
]

[tool.pytest.ini_options]
addopts = "-v --capture=no"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Month columns in the panel are timezone-naive polars datetimes, so naive
# `datetime` literals are intentional across the engine and its tests.
ignore = ["DTZ001", "DTZ005"]
