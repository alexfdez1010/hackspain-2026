# Fly.io deployment example:
#   fly launch --no-deploy --copy-config
#   fly deploy
app = "hackspain-xray-api"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PULSE_DATA_DIR = "/app/data"
  PULSE_CORS_ORIGINS = "https://hackspain-xray.vercel.app,http://localhost:3000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
