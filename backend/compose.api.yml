services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hackspain-pulse-api:latest
    container_name: pulse-api
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: "8000"
      PULSE_DATA_DIR: /app/data
      PULSE_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    # Uncomment to serve artefacts regenerated on the host instead of the baked
    # ones (the image already ships data/pulse/{web,recommendations,models}).
    # volumes:
    #   - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
