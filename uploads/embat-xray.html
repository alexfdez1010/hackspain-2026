<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embat X-Ray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   EMBAT X-RAY — capa de presentación
   ---------------------------------------------------------------------------
   Contrato de datos (congelado). El pipeline de Python escribe:
     /public/data/index.json          -> { generated_at, model_version, months[], companies[] }
     /public/data/company/{id}.json   -> { series, pillars, waterfall, events, regime,
                                           actions, rehab, explanation, signature }
   Aquí ese contrato está simulado en DATA (ver <script>). Sustituir el bloque
   BOOTSTRAP por dos fetch() y el resto del fichero no se toca.
   ===========================================================================*/

:root{
  --ground:#131A2A;
  --raised:#1A2336;
  --sunken:#0F1522;
  --ink:#E9ECF4;
  --ink-2:#AEB6C8;
  --ink-3:#7F889D;
  --rule:rgba(233,236,244,.15);
  --rule-soft:rgba(233,236,244,.07);
  --lift:rgba(255,255,255,.055);
  --focus:#8FD8FF;
  --s0:#8A2F53;  --s1:#C2553C;  --s2:#D9A03F;  --s3:#7FAE71;  --s4:#49C8BE;
  --grid-max:1180px;
}
:root[data-theme="light"]{
  --ground:#E9EBF0; --raised:#F7F8FB; --sunken:#DFE2E9;
  --ink:#171C28; --ink-2:#4B5366; --ink-3:#6E7789;
  --rule:rgba(23,28,40,.16); --rule-soft:rgba(23,28,40,.08);
  --lift:rgba(255,255,255,.7); --focus:#1B6FA8;
  --s0:#8A2F53; --s1:#B84A31; --s2:#B9822A; --s3:#4F8C52; --s4:#1E8F8A;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#E9EBF0; --raised:#F7F8FB; --sunken:#DFE2E9;
    --ink:#171C28; --ink-2:#4B5366; --ink-3:#6E7789;
    --rule:rgba(23,28,40,.16); --rule-soft:rgba(23,28,40,.08);
    --lift:rgba(255,255,255,.7); --focus:#1B6FA8;
    --s0:#8A2F53; --s1:#B84A31; --s2:#B9822A; --s3:#4F8C52; --s4:#1E8F8A;
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.n{font-variant-numeric:tabular-nums}

/* ---------- estructura ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{
  border-right:1px solid var(--rule);
  padding:26px 0 18px;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
  background:var(--ground);
  z-index:5;
}
.mark{padding:0 22px 22px;border-bottom:1px solid var(--rule-soft)}
.mark b{display:block;font-size:17px;font-weight:600;letter-spacing:-.025em}
.mark span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;letter-spacing:.01em}

.steps{list-style:none;margin:0;padding:14px 0;flex:1;overflow-y:auto}
.step{display:block;width:100%;text-align:left;padding:9px 22px;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:baseline;color:var(--ink-2);position:relative}
.step:hover{color:var(--ink)}
.step em{font-style:normal;font-size:11.5px;color:var(--ink-3)}
.step i{font-style:normal;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.step b{font-weight:500;font-size:14px}
.step[aria-current="true"]{color:var(--ink)}
.step[aria-current="true"]::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;background:var(--ink)}
.step[aria-current="true"] b{font-weight:600}
.step.due{color:var(--s2)}

.railfoot{padding:14px 22px 0;border-top:1px solid var(--rule-soft);display:grid;gap:10px}
.clock{display:flex;align-items:baseline;gap:8px}
.clock b{font-size:24px;font-weight:600;letter-spacing:-.02em}
.clock span{font-size:11.5px;color:var(--ink-3)}
.minibtn{font-size:12px;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:3px 11px}
.minibtn:hover{color:var(--ink);border-color:var(--ink-3)}
.railrow{display:flex;gap:6px;flex-wrap:wrap}

.stage{min-width:0;padding:34px 40px 90px;max-width:var(--grid-max)}
.pacer{position:fixed;top:0;left:232px;right:0;height:2px;background:transparent;z-index:9}
.pacer i{display:block;height:100%;width:0;background:var(--s2);transition:width .5s linear}

/* ---------- tipografía de página ---------- */
.head{margin:0 0 4px;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.thesis{
  font-family:"Newsreader",Georgia,serif;font-weight:300;font-size:20px;line-height:1.45;
  color:var(--ink-2);max-width:56ch;margin:0 0 30px;
}
.thesis b{font-weight:400;color:var(--ink)}
h3.sec{font-size:13.5px;font-weight:600;letter-spacing:-.005em;margin:0 0 12px;color:var(--ink)}
p.note{font-size:13px;color:var(--ink-3);max-width:70ch;margin:8px 0 0;line-height:1.55}

/* ---------- superficies ---------- */
.panel{background:var(--raised);border:1px solid var(--rule-soft);border-radius:10px;padding:18px 20px;position:relative}
.panel::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:var(--lift);border-radius:10px 10px 0 0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}

.stat b{display:block;font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.stat span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:4px;max-width:24ch}

/* ---------- tablas ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12px;padding:0 0 8px;border-bottom:1px solid var(--rule-soft)}
td{padding:9px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}

/* ---------- piezas ---------- */
.band{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2)}
.chip.on{border-color:transparent;background:var(--sunken);color:var(--ink)}

.act{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule-soft)}
.act:last-child{border-bottom:0}
.act p{margin:0;font-size:13.5px}
.act small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.gain{font-size:17px;font-weight:600;white-space:nowrap;letter-spacing:-.02em}
.do{border:1px solid var(--rule);border-radius:999px;padding:5px 14px;font-size:12.5px;white-space:nowrap}
.do:hover{border-color:var(--ink-3)}
.do[data-done="1"]{border-color:transparent;background:var(--sunken);color:var(--ink-3)}

.tests{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:7px}
.tests li{display:grid;grid-template-columns:16px 1fr;gap:9px;font-size:13px;color:var(--ink-2);align-items:baseline}
.tests i{font-style:normal;font-weight:600}

.timeline{list-style:none;margin:0;padding:0;border-left:1px solid var(--rule);margin-left:5px}
.timeline li{padding:0 0 15px 18px;position:relative;font-size:13px;color:var(--ink-2)}
.timeline li::before{content:"";position:absolute;left:-4px;top:7px;width:7px;height:7px;border-radius:2px;background:var(--ink-3)}
.timeline li b{display:block;color:var(--ink);font-weight:500}
.timeline li span{font-size:11.5px;color:var(--ink-3)}

.hold{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hold b{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1}
.hold p{margin:0;font-size:13px;color:var(--ink-2);max-width:48ch}
.hold p em{font-style:normal;color:var(--ink)}

.picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

.ask{display:grid;grid-template-columns:1fr auto;gap:10px}
.ask input{
  font:inherit;color:var(--ink);background:var(--sunken);
  border:1px solid var(--rule);border-radius:8px;padding:11px 14px;width:100%;
}
.ask input::placeholder{color:var(--ink-3)}
.ask button{border:1px solid var(--rule);border-radius:8px;padding:0 18px}
.answer{margin-top:14px;font-size:14.5px;line-height:1.6;max-width:66ch}
.answer .src{display:block;margin-top:10px;font-size:11.5px;color:var(--ink-3)}
pre.json{
  margin:0;font-size:11.5px;line-height:1.6;color:var(--ink-2);
  background:var(--sunken);border:1px solid var(--rule-soft);border-radius:8px;
  padding:14px 16px;overflow-x:auto;white-space:pre;
  font-family:"Archivo",ui-monospace,monospace;
}

svg{display:block;overflow:visible}
.axis{font-size:10.5px;fill:var(--ink-3)}
.gridline{stroke:var(--rule-soft);stroke-width:1}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  .steps{display:flex;overflow-x:auto;padding:10px 0}
  .step{grid-template-columns:auto;white-space:nowrap;padding:8px 16px}
  .step em,.step i{display:none}
  .step[aria-current="true"]::before{left:16px;right:16px;top:auto;bottom:0;width:auto;height:2px}
  .pacer{left:0}
  .stage{padding:22px 18px 70px}
  .g2,.g3,.g4,.split{grid-template-columns:minmax(0,1fr)}
  .head{font-size:24px}
  .thesis{font-size:18px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Guion del pitch">
    <div class="mark"><b>Embat X&#8209;Ray</b><span>Salud financiera continua</span></div>
    <ul class="steps" id="steps"></ul>
    <div class="railfoot">
      <div class="clock"><b id="clock">0:00</b><span id="clockhint">5 minutos</span></div>
      <div class="railrow">
        <button class="minibtn" id="run">Ensayar</button>
        <button class="minibtn" id="reset">Reiniciar</button>
        <button class="minibtn" id="theme">Sala clara</button>
      </div>
    </div>
  </nav>
  <main class="stage" id="stage" tabindex="-1"></main>
</div>
<div class="pacer"><i id="pacerbar"></i></div>

<script>
/* ========================================================================== */
/* BOOTSTRAP — sustituir por fetch('/data/index.json') cuando exista el pipeline */
/* ========================================================================== */

const MONTHS = (() => {
  const out = [], names = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  let y = 2024, m = 9; // oct-2024 .. sep-2026
  for (let i = 0; i < 24; i++) { out.push({ k: i, label: names[m] + " " + String(y).slice(2), long: names[m] + " " + y }); m++; if (m > 11) { m = 0; y++; } }
  return out;
})();

function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const SECTORS = ["Industrial","Distribución","Alimentación","Construcción","Logística","Servicios","Retail","Química","Automoción","Agro"];
const HEADS = ["Velasco","Northbrook","Arcela","Mendive","Torralba","Kestrel","Bonaval","Aridane","Lumbrera","Saldaña","Verdeña","Ormaza","Cintruénigo","Baltar","Norteña","Peñalba","Olivares","Ribamar","Quintanar","Teverga","Aldabe","Cerezal","Fontela","Miramar","Nogueira","Sarrión","Vallcarca","Ardanza","Brezal","Caldera","Duranguesa","Espadán","Finisterre","Gaztelu","Hontanar","Iraeta","Jarama","Lastanosa","Monteagudo","Navacerrada"];
const TAILS = ["Industrial","Grupo","Logística","Ibérica","Distribución","Partners","Servicios","Agro","Sistemas","Europa","Levante","Norte"];

function buildUniverse(){
  const r = rng(20260919), list = [];
  for (let i = 0; i < 1286; i++){
    const head = HEADS[Math.floor(r() * HEADS.length)];
    const tail = TAILS[Math.floor(r() * TAILS.length)];
    const base = 34 + r() * 56;
    const trend = (r() - .48) * 2.2;
    const shock = r() < .11 ? { at: 8 + Math.floor(r() * 11), size: -(7 + r() * 16) } : null;
    const seas = 2 + r() * 5, phase = r() * 6.28, noise = 1.1 + r() * 2.1;
    const series = [];
    for (let m = 0; m < 24; m++){
      let v = base + trend * m + Math.sin(m / 12 * 6.283 + phase) * seas + (r() - .5) * noise * 2;
      if (shock && m >= shock.at) v += shock.size * Math.min(1, (m - shock.at + 1) / 3);
      series.push(Math.max(4, Math.min(98, v)));
    }
    const score = series[23], d3 = score - series[20], d6 = score - series[17];
    list.push({
      id: "C" + String(1000 + i), name: head + " " + tail,
      sector: SECTORS[Math.floor(r() * SECTORS.length)],
      group: "G" + String(100 + Math.floor(i / 5.15)),
      series, score, d3, d6,
      cashDays: Math.max(3, Math.round(7 + score * .85 + (r() - .5) * 22)),
      structural: !!shock && shock.at <= 20 && d6 < -9,
      seed: Math.floor(r() * 1e9)
    });
  }
  // Las dos empresas del brief, fijadas a mano. Abren el pitch.
  const velasco = list.find(c => c.name.startsWith("Velasco")) || list[0];
  const north   = list.find(c => c.name.startsWith("Northbrook")) || list[1];
  Object.assign(velasco, {
    id:"C0001", name:"Velasco Industrial", sector:"Industrial", group:"G101", pinned:true,
    series:[80,82,81,83,82,83,82,84,83,82,83,82,83,84,83,83,83,82,82,80,77,74,71,68],
    structural:true, cashDays:26
  });
  Object.assign(north, {
    id:"C0002", name:"Northbrook Distribución", sector:"Distribución", group:"G102", pinned:true,
    series:[52,50,48,47,46,45,44,45,45,44,45,46,47,48,50,52,54,56,58,60,62,63,64,65],
    structural:false, cashDays:61
  });
  for (const c of [velasco, north]){ c.score = c.series[23]; c.d3 = c.score - c.series[20]; c.d6 = c.score - c.series[17]; }
  return list;
}

const UNIVERSE = buildUniverse();
const BY_ID = Object.fromEntries(UNIVERSE.map(c => [c.id, c]));

/* ---- detalle por empresa (lo que el pipeline precomputa en company/{id}.json) ---- */
const PILLARS = [
  { k:"liq", n:"Liquidez",  d:"Días de caja, mínimo intramensual, descubiertos" },
  { k:"deu", n:"Deuda",     d:"Utilización de líneas, servicio de deuda, coste medio" },
  { k:"cob", n:"Cobros",    d:"DSO, aging, concentración de clientes" },
  { k:"pag", n:"Pagos",     d:"DPO, retrasos a proveedores, plazo concedido" },
  { k:"act", n:"Actividad", d:"Facturación desestacionalizada, flujo neto" },
  { k:"gru", n:"Grupo",     d:"Dependencia de flujos intragrupo" }
];

const FIXED = {
  C0001:{
    pillars:{liq:54,deu:22,cob:71,pag:31,act:76,gru:64},
    prev:   {liq:71,deu:68,cob:74,pag:70,act:78,gru:66},
    signal:{month:18,label:"abr 2026"},
    events:[
      {m:18,t:"La utilización de la línea de crédito pasa del 34% al 51%",s:"Primera señal detectable. El score seguía en 82 y no se había movido."},
      {m:19,t:"El DPO se alarga de 42 a 53 días",s:"Segundo pilar afectado. El detector de régimen deja de leerlo como estacional."},
      {m:20,t:"Vence el tramo bullet de 1,2 M€ con Banco Norte",s:"Servicio de deuda a 12 meses sube al 41% del flujo operativo."},
      {m:21,t:"Utilización al 79%, DPO en 67 días",s:"Deterioro confirmado como estructural: 4 de 4 tests."},
      {m:23,t:"Mínimo intramensual de caja: 310 k€ el día 28",s:"Con un outflow medio diario de 92 k€ quedan 26 días de caja."}
    ],
    actions:[
      {t:"Adelantar el cobro de 3 facturas de Aldabe Europa",s:"340 k€ en el tramo de más de 90 días. Confirming disponible al 4,1%.",g:22},
      {t:"Disponer 600 k€ de la línea de Banco Sur",s:"Es la más barata de las cinco: 3,4% frente al 5,9% de la que está al 79%.",g:31},
      {t:"Renegociar el vencimiento de febrero con Banco Norte",s:"Alargar 18 meses cuesta 14 k€ y quita el pico de tesorería.",g:18},
      {t:"Barrido a la cuenta principal",s:"Hay 410 k€ dispersos en cinco bancos sin remunerar.",g:9},
      {t:"Contrato de Miramar Ibérica cayendo un 31%",s:"Aquí no hay palanca financiera. Es una conversación comercial, esta semana.",g:0}
    ],
    explanation:"Velasco Industrial baja de 82 a 68 en seis meses. El 61% de la caída viene del pilar Deuda: la utilización de la línea de crédito pasa del 34% al 79% entre marzo y julio. El segundo factor es Pagos, con el DPO alargándose de 42 a 67 días. Ventas y cobros están estables, así que no es un problema de demanda, es un problema de caja. Primera señal detectable en abril de 2026, cinco meses antes de que el score bajara de 70."
  },
  C0002:{
    pillars:{liq:69,deu:74,cob:62,pag:71,act:58,gru:55},
    prev:   {liq:51,deu:49,cob:44,pag:52,act:47,gru:53},
    signal:{month:12,label:"oct 2025"},
    events:[
      {m:12,t:"La utilización de líneas baja del 72% al 58%",s:"Primera señal de mejora. El score todavía marcaba 47."},
      {m:15,t:"El DSO se acorta de 74 a 61 días",s:"Músculo para exigir cobro: la otra cara de la misma medida."},
      {m:18,t:"Cancelación anticipada del factoring caro",s:"Coste medio ponderado de la deuda del 6,8% al 5,1%."},
      {m:22,t:"Nueve meses consecutivos de flujo neto positivo",s:"La mejora supera la banda de ruido de su propia historia."}
    ],
    actions:[
      {t:"Reabrir el límite preaprobado en 1,8 M€",s:"La mejora sostenida cambia la banda. El precio baja 150 pb.",g:0},
      {t:"Sustituir el confirming restante por línea propia",s:"Ahorro estimado de 31 k€ al año sobre el circulante actual.",g:12},
      {t:"Mantener el barrido diario",s:"Ya activo. Aporta 9 días de caja frente a la dispersión anterior.",g:9}
    ],
    explanation:"Northbrook Distribución sube de 45 a 65 en dieciocho meses. La mejora está repartida: Deuda aporta el 38% (la utilización de líneas cae del 72% al 31%), Cobros el 27% (DSO de 74 a 61 días) y Liquidez el 21%. La misma medida que detecta el deterioro detecta la recuperación, con la misma sensibilidad. Primera señal detectable en octubre de 2025."
  }
};

function detail(c){
  if (FIXED[c.id]) return { ...FIXED[c.id], company:c };
  const r = rng(c.seed), p = {}, prev = {};
  for (const pl of PILLARS){
    const v = Math.max(6, Math.min(96, c.score + (r() - .5) * 34));
    p[pl.k] = Math.round(v);
    prev[pl.k] = Math.round(Math.max(4, Math.min(98, v - c.d6 * (.5 + r()))));
  }
  const dir = c.d6 < 0 ? "deterioro" : "mejora";
  return {
    company:c, pillars:p, prev,
    signal:{ month:Math.max(2, 23 - Math.round(3 + r() * 5)), label:MONTHS[Math.max(0, 23 - Math.round(3 + r() * 5))].long },
    events:[
      {m:23 - 5,t:"Cambio de régimen detectado en el pilar Deuda",s:"Primera señal por encima del umbral de la propia empresa."},
      {m:23 - 3,t:"Segundo pilar afectado: Pagos",s:"El detector pasa de transitorio a " + (c.structural ? "estructural" : "vigilado") + "."},
      {m:23,t:"Score de cierre " + Math.round(c.score),s:"Banda " + bandName(c.score) + ", " + dir + " de " + Math.abs(Math.round(c.d6)) + " puntos en seis meses."}
    ],
    actions:[
      {t:"Adelantar el cobro de las facturas de más de 90 días",s:"Hay " + (120 + Math.round(r() * 400)) + " k€ en ese tramo.",g:9 + Math.round(r() * 18)},
      {t:"Disponer de la línea más barata antes que de la habitual",s:"Diferencial de " + (140 + Math.round(r() * 160)) + " pb entre la mejor y la que se está usando.",g:7 + Math.round(r() * 22)},
      {t:"Barrido a la cuenta principal",s:"Saldo disperso en " + (3 + Math.round(r() * 3)) + " bancos.",g:4 + Math.round(r() * 9)}
    ],
    explanation:c.name + " cierra en " + Math.round(c.score) + " puntos, con una variación de " + fmtDelta(c.d6) + " en seis meses. El movimiento se concentra en los pilares de Deuda y Pagos, que son los que se mueven primero cuando la tensión es de caja y no de demanda."
  };
}

/* ========================================================================== */
/* ESPECTRO — el color significa exactamente una cosa: el score. Nada más.     */
/* ========================================================================== */
const STOPS_DARK  = [[138,47,83],[194,85,60],[217,160,63],[127,174,113],[73,200,190]];
const STOPS_LIGHT = [[138,47,83],[184,74,49],[185,130,42],[79,140,82],[30,143,138]];
let STOPS = STOPS_DARK;

function spectrum(score){
  const t = Math.max(0, Math.min(1, score / 100)) * (STOPS.length - 1);
  const i = Math.min(STOPS.length - 2, Math.floor(t)), f = t - i;
  const a = STOPS[i], b = STOPS[i + 1];
  return "rgb(" + a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(",") + ")";
}
function bandName(s){ return s < 30 ? "Crítica" : s < 50 ? "Tensión" : s < 70 ? "Vigilancia" : s < 85 ? "Estable" : "Holgada"; }
function fmtDelta(d){ const v = Math.round(d); return (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v); }
function eur(n){ return n >= 1e6 ? (n / 1e6).toFixed(1).replace(".", ",") + " M€" : Math.round(n / 1e3) + " k€"; }

/* ========================================================================== */
/* GRÁFICOS — SVG generado, sin librerías. Tres formas y nada más.             */
/* ========================================================================== */
const NS = "http://www.w3.org/2000/svg";
function svg(w, h, cls){ const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 " + w + " " + h); s.setAttribute("width", "100%"); s.setAttribute("preserveAspectRatio", "none"); s.style.height = h + "px"; if (cls) s.setAttribute("class", cls); return s; }
function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

/* Campo de espectro: cada empresa una línea. Posición = score, altura = días de caja. */
function spectrumField(list, w, h){
  const s = svg(w, h);
  s.setAttribute("preserveAspectRatio", "none");
  s.setAttribute("role", "img");
  s.setAttribute("aria-label", "Distribución de las " + list.length + " empresas por score de salud financiera");
  const pad = 26, innerW = w - pad * 2, base = h - 22;
  for (let g = 0; g <= 100; g += 20){
    const x = pad + innerW * g / 100;
    s.appendChild(el("line", { x1:x, x2:x, y1:6, y2:base, class:"gridline" }));
    const t = el("text", { x:x, y:h - 6, class:"axis", "text-anchor":"middle" }); t.textContent = g; s.appendChild(t);
  }
  const sorted = [...list].sort((a, b) => a.score - b.score);
  for (const c of sorted){
    const x = pad + innerW * (c.score / 100);
    const len = 8 + Math.min(1, c.cashDays / 110) * (base - 16);
    const moved = Math.abs(c.d3) > 6;
    s.appendChild(el("line", {
      x1:x, x2:x, y1:base, y2:base - len,
      stroke:spectrum(c.score), "stroke-width":moved ? 1.6 : 1,
      opacity:moved ? .95 : .34
    }));
    if (moved){
      const dy = c.d3 > 0 ? -5 : 5;
      s.appendChild(el("line", { x1:x, x2:x + (c.d3 > 0 ? 3.2 : -3.2), y1:base - len - 4, y2:base - len - 4 + dy, stroke:spectrum(c.score), "stroke-width":1.4, opacity:.9 }));
    }
  }
  return s;
}

/* Serie de 24 meses. */
function trace(series, w, h, opts){
  opts = opts || {};
  const s = svg(w, h), pad = { l:0, r:0, t:8, b:opts.axis ? 18 : 6 };
  const innerH = h - pad.t - pad.b, innerW = w;
  const x = i => innerW * i / (series.length - 1);
  const y = v => pad.t + innerH * (1 - v / 100);
  if (opts.axis) for (const g of [25, 50, 75]) s.appendChild(el("line", { x1:0, x2:w, y1:y(g), y2:y(g), class:"gridline" }));
  let d = "";
  series.forEach((v, i) => { d += (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " "; });
  let area = d + "L" + innerW + " " + (h - pad.b) + " L0 " + (h - pad.b) + " Z";
  const gid = "g" + Math.random().toString(36).slice(2, 8);
  const lg = el("linearGradient", { id:gid, x1:"0", x2:"1", y1:"0", y2:"0" });
  series.forEach((v, i) => { if (i % 4 === 0 || i === series.length - 1) lg.appendChild(el("stop", { offset:(i / (series.length - 1) * 100) + "%", "stop-color":spectrum(v) })); });
  const defs = el("defs", {}); defs.appendChild(lg); s.appendChild(defs);
  if (opts.fill) s.appendChild(el("path", { d:area, fill:"url(#" + gid + ")", opacity:.12 }));
  s.appendChild(el("path", { d:d, fill:"none", stroke:"url(#" + gid + ")", "stroke-width":opts.thin ? 1.6 : 2.2, "stroke-linejoin":"round", "stroke-linecap":"round" }));
  if (opts.mark != null){
    s.appendChild(el("line", { x1:x(opts.mark), x2:x(opts.mark), y1:pad.t, y2:h - pad.b, stroke:"currentColor", "stroke-width":1, "stroke-dasharray":"2 3", opacity:.45 }));
    const t = el("text", { x:x(opts.mark) + 5, y:pad.t + 10, class:"axis" }); t.textContent = opts.markLabel || ""; s.appendChild(t);
  }
  const last = series[series.length - 1];
  s.appendChild(el("circle", { cx:x(series.length - 1), cy:y(last), r:3.2, fill:spectrum(last) }));
  if (opts.axis){
    [0, 6, 12, 18, 23].forEach(i => { const t = el("text", { x:Math.min(innerW - 14, Math.max(0, x(i))), y:h - 4, class:"axis", "text-anchor":i === 0 ? "start" : i === 23 ? "end" : "middle" }); t.textContent = MONTHS[i].label; s.appendChild(t); });
  }
  return s;
}

/* Waterfall de la variación del score por pilar. */
function waterfall(d, w, h){
  const s = svg(w, h);
  const items = PILLARS.map(p => ({ n:p.n, v:(d.pillars[p.k] - d.prev[p.k]) * .18 })).sort((a, b) => a.v - b.v);
  const total = items.reduce((a, b) => a + b.v, 0);
  const pad = { t:10, b:24 }, mid = (h - pad.b) / 2 + pad.t / 2;
  const colW = w / (items.length + 1), maxAbs = Math.max(4, ...items.map(i => Math.abs(i.v)));
  const scale = (h - pad.b - pad.t) / 2 / maxAbs;
  s.appendChild(el("line", { x1:0, x2:w, y1:mid, y2:mid, stroke:"currentColor", opacity:.28, "stroke-width":1 }));
  items.forEach((it, i) => {
    const x = colW * i + colW * .18, bw = colW * .64;
    const hgt = Math.abs(it.v) * scale;
    s.appendChild(el("rect", { x:x, y:it.v >= 0 ? mid - hgt : mid, width:bw, height:Math.max(1.5, hgt), rx:2, fill:spectrum(it.v >= 0 ? 78 : 26), opacity:.85 }));
    const t = el("text", { x:x + bw / 2, y:h - 10, class:"axis", "text-anchor":"middle" }); t.textContent = it.n; s.appendChild(t);
    const v = el("text", { x:x + bw / 2, y:it.v >= 0 ? mid - hgt - 4 : mid + hgt + 11, class:"axis", "text-anchor":"middle" }); v.textContent = fmtDelta(it.v); s.appendChild(v);
  });
  const x = colW * items.length + colW * .18, bw = colW * .64, hgt = Math.abs(total) * scale;
  s.appendChild(el("rect", { x:x, y:total >= 0 ? mid - hgt : mid, width:bw, height:Math.max(1.5, hgt), rx:2, fill:"currentColor", opacity:.55 }));
  const t = el("text", { x:x + bw / 2, y:h - 10, class:"axis", "text-anchor":"middle" }); t.textContent = "Total"; s.appendChild(t);
  return s;
}

/* Histograma de antelación. */
function histogram(bins, w, h){
  const s = svg(w, h), max = Math.max(...bins.map(b => b.v)), pad = { t:12, b:26 };
  const colW = w / bins.length;
  bins.forEach((b, i) => {
    const hgt = (h - pad.t - pad.b) * b.v / max;
    s.appendChild(el("rect", { x:colW * i + colW * .14, y:h - pad.b - hgt, width:colW * .72, height:hgt, rx:2, fill:spectrum(28 + i * 15), opacity:.9 }));
    const t = el("text", { x:colW * i + colW * .5, y:h - 10, class:"axis", "text-anchor":"middle" }); t.textContent = b.k; s.appendChild(t);
    const v = el("text", { x:colW * i + colW * .5, y:h - pad.b - hgt - 5, class:"axis", "text-anchor":"middle" }); v.textContent = b.v + "%"; s.appendChild(v);
  });
  return s;
}

/* Cobertura frente a falsas alarmas, con los dos puntos de operación. */
function tradeoff(w, h){
  const s = svg(w, h), pad = { l:34, r:14, t:12, b:28 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const X = v => pad.l + iw * v / 2.4, Y = v => pad.t + ih * (1 - v / 100);
  for (const g of [0, 25, 50, 75, 100]){
    s.appendChild(el("line", { x1:pad.l, x2:w - pad.r, y1:Y(g), y2:Y(g), class:"gridline" }));
    const t = el("text", { x:pad.l - 7, y:Y(g) + 3.5, class:"axis", "text-anchor":"end" }); t.textContent = g; s.appendChild(t);
  }
  for (const g of [0, .8, 1.6, 2.4]){
    const t = el("text", { x:X(g), y:h - 9, class:"axis", "text-anchor":"middle" }); t.textContent = String(g).replace(".", ","); s.appendChild(t);
  }
  let d = "";
  for (let i = 0; i <= 60; i++){
    const fa = i / 60 * 2.4, cov = 100 * (1 - Math.exp(-1.55 * fa)) * .93;
    d += (i ? "L" : "M") + X(fa).toFixed(1) + " " + Y(cov).toFixed(1) + " ";
  }
  s.appendChild(el("path", { d:d, fill:"none", stroke:spectrum(72), "stroke-width":2 }));
  const pts = [
    { fa:1.9, cov:94, c:spectrum(88), lbl:"Hacia la empresa" },
    { fa:.8,  cov:74, c:spectrum(24), lbl:"Hacia el financiador" }
  ];
  for (const p of pts){
    s.appendChild(el("circle", { cx:X(p.fa), cy:Y(p.cov), r:5, fill:p.c }));
    s.appendChild(el("circle", { cx:X(p.fa), cy:Y(p.cov), r:9, fill:"none", stroke:p.c, opacity:.45 }));
    const t = el("text", { x:X(p.fa) - 12, y:Y(p.cov) - 14, class:"axis", "text-anchor":"end" });
    t.textContent = p.lbl; t.setAttribute("fill", "currentColor"); s.appendChild(t);
  }
  const yl = el("text", { x:pad.l - 7, y:pad.t - 2, class:"axis", "text-anchor":"end" }); yl.textContent = "%"; s.appendChild(yl);
  const xl = el("text", { x:w - pad.r, y:h - 9, class:"axis", "text-anchor":"end" }); xl.textContent = "falsas alarmas por empresa y año"; s.appendChild(xl);
  return s;
}

/* Camino de vuelta: el modelo invertido. */
function rehab(from, w, h){
  const s = svg(w, h), pad = { t:12, b:26 }, n = 14;
  const X = i => w * i / (n - 1), Y = v => pad.t + (h - pad.t - pad.b) * (1 - v / 100);
  for (const g of [50, 70, 85]){
    s.appendChild(el("line", { x1:0, x2:w, y1:Y(g), y2:Y(g), class:"gridline" }));
    const t = el("text", { x:2, y:Y(g) - 4, class:"axis" }); t.textContent = bandName(g + 1); s.appendChild(t);
  }
  let d = "", pts = [];
  for (let i = 0; i < n; i++){ const v = Math.min(92, from + (92 - from) * (1 - Math.exp(-i / 4.4))); pts.push(v); d += (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1) + " "; }
  s.appendChild(el("path", { d:d, fill:"none", stroke:spectrum(80), "stroke-width":2, "stroke-dasharray":"5 4" }));
  [[0,"hoy"],[4,"4 meses"],[8,"8 meses"],[13,"13 meses"]].forEach(([i, lbl]) => {
    s.appendChild(el("circle", { cx:X(i), cy:Y(pts[i]), r:3.4, fill:spectrum(pts[i]) }));
    const t = el("text", { x:Math.min(w - 4, X(i)), y:h - 9, class:"axis", "text-anchor":i === 0 ? "start" : i === 13 ? "end" : "middle" }); t.textContent = lbl; s.appendChild(t);
  });
  return s;
}

const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in (attrs || {})){
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const kid of kids.flat()) if (kid != null) e.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  return e;
};
const panel = (...kids) => h("div", { class:"panel" }, kids);
const secTitle = t => h("h3", { class:"sec" }, t);

function header(title, thesisHTML){

}

function answerFor(q){
  const t = q.toLowerCase().trim();
  if (!t) return null;
  const hit = UNIVERSE.find(c => t.includes(c.name.toLowerCase().split(" ")[0]));
  const c = hit || BY_ID.C0001, d = detail(c);
  if (/(qu[eé] hago|acci[oó]n|qu[eé] hacer|c[oó]mo)/.test(t)){
    const a = d.actions[0];
    return { text:"La acción con más retorno para " + c.name + " es: " + a.t.toLowerCase() + ". " + a.s + " Devuelve " + a.g + " días de caja. Hay " + (d.actions.length - 1) + " acciones más abiertas en su ficha.", src:"company/" + c.id + ".json → actions[0]" };
  }
  if (/(cu[aá]ndo|antelaci[oó]n|primera se[nñ]al)/.test(t)){
    return { text:"La primera señal detectable en " + c.name + " es de " + d.signal.label + ", " + (23 - d.signal.month) + " meses antes del cierre. Se disparó en el pilar de Deuda, por utilización creciente de líneas, cuando el score todavía no se había movido.", src:"company/" + c.id + ".json → signal" };
  }
  if (/(bache|estructural|r[eé]gimen|transitorio)/.test(t)){
    return { text:c.name + (c.structural ? " está clasificada como deterioro estructural: cumple los cuatro tests, persiste tres meses bajo su media móvil, afecta a dos pilares y no lo explica su estacionalidad." : " está clasificada como bache transitorio: solo cumple uno de los cuatro tests, así que se vigila pero no se escala a los financiadores."), src:"company/" + c.id + ".json → regime" };
  }
  if (/(l[ií]mite|financiaci[oó]n|cr[eé]dito|cu[aá]nto)/.test(t)){
    const lim = Math.round(c.score * 22) / 1000;
    return { text:"Con el score de cierre de " + Math.round(c.score) + ", el límite de circulante preaprobado para " + c.name + " es de " + String(lim).replace(".", ",") + " M€. Se recalcula cada mes y el movimiento está topado por periodo, para que el límite no se mueva más rápido de lo que la empresa puede reaccionar.", src:"company/" + c.id + ".json → facility" };
  }
  return { text:d.explanation, src:"company/" + c.id + ".json → explanation" };
}

const SCREENS = [
  { n:"Cartera",      t:"0:00", at:0,   f:screenCartera },
  { n:"Las dos caras",t:"0:30", at:30,  f:screenCaras },
  { n:"Ficha",        t:"1:00", at:60,  f:screenFicha },
  { n:"Antelación",   t:"2:15", at:135, f:screenAnticipacion },
  { n:"Monitor",      t:"3:00", at:180, f:screenMonitor },
  { n:"Producto",     t:"3:30", at:210, f:screenProducto },
  { n:"Preguntar",    t:"4:15", at:255, f:screenAsk }
];
let current = 0, t = 0, running = false, timer = null;

function go(i, companyId){
  current = Math.max(0, Math.min(SCREENS.length - 1, i));
  if (companyId){ fichaId = companyId; current = 2; }
  render();
  document.getElementById("stage").focus({ preventScroll:true });
  window.scrollTo({ top:0, behavior:"instant" });
}

function renderRail(){
  const ul = document.getElementById("steps");
  ul.replaceChildren();
  SCREENS.forEach((s, i) => {
    const due = running && t >= s.at && (i === SCREENS.length - 1 || t < SCREENS[i + 1].at) && i !== current;
    const b = h("button", { class:"step" + (due ? " due" : ""), "aria-current":i === current ? "true" : "false", onclick:() => go(i) },
      h("i", null, String(i + 1)), h("b", null, s.n), h("em", null, s.t));
    ul.appendChild(h("li", null, b));
  });
}

function render(){
  const stage = document.getElementById("stage");
  stage.replaceChildren();
  for (const node of SCREENS[current].f()) stage.appendChild(node);
  renderRail();
}

function fmtClock(sec){ return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
function tick(){
  t++;
  document.getElementById("clock").textContent = fmtClock(t);
  document.getElementById("pacerbar").style.width = Math.min(100, t / 300 * 100) + "%";
  const should = SCREENS.reduce((acc, s, i) => t >= s.at ? i : acc, 0);
  document.getElementById("clockhint").textContent = t > 300 ? "pasado" : should === current ? "en hora" : should > current ? "vais tarde: " + SCREENS[should].n : "vais rápido";
  renderRail();
  if (t >= 330) stop();
}
function start(){ if (running) return; running = true; timer = setInterval(tick, 1000); document.getElementById("run").textContent = "Pausar"; }
function stop(){ running = false; clearInterval(timer); document.getElementById("run").textContent = "Ensayar"; renderRail(); }

document.getElementById("run").onclick = () => running ? stop() : start();
document.getElementById("reset").onclick = () => { stop(); t = 0; document.getElementById("clock").textContent = "0:00"; document.getElementById("clockhint").textContent = "5 minutos"; document.getElementById("pacerbar").style.width = "0"; };

/* Tema: la sala decide, no nosotros. */
function applyTheme(){
  const dark = document.documentElement.getAttribute("data-theme") === "dark"
    || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  STOPS = dark ? STOPS_DARK : STOPS_LIGHT;
  document.getElementById("theme").textContent = dark ? "Sala clara" : "Sala oscura";
  render();
}
document.getElementById("theme").onclick = () => {
  const now = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", now === "dark" ? "light" : "dark");
  applyTheme();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!document.documentElement.getAttribute("data-theme")) applyTheme(); });

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === "PageDown") go(current + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(current - 1);
  if (e.key === " "){ e.preventDefault(); running ? stop() : start(); }
});

let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 180); });

applyTheme();
</script>
